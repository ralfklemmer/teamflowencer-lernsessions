<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Große Codebasen für KI-Agenten erschließen – Coming Soon</title>
  <desc id="desc">Dunkles TeamFlowencer-Tutorialmotiv mit stilisierter Repo Map, Serena-Navigation und diagonalem Coming-Soon-Schriftzug.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1620"/>
      <stop offset="0.58" stop-color="#162b3a"/>
      <stop offset="1" stop-color="#213f50"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f3b51b"/>
      <stop offset="1" stop-color="#c18700"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity=".32"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#fff" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <circle cx="1390" cy="110" r="330" fill="#f3b51b" opacity=".06"/>
  <circle cx="100" cy="820" r="290" fill="#5cb7d1" opacity=".06"/>

  <g font-family="Avenir Next, Helvetica Neue, Arial, sans-serif">
    <g transform="translate(110 95)">
      <rect width="245" height="44" rx="22" fill="#f3b51b"/>
      <text x="122.5" y="29" text-anchor="middle" font-size="19" font-weight="800" letter-spacing="2.4" fill="#152330">PRAXIS-TUTORIAL</text>
    </g>

    <text x="110" y="245" font-size="74" font-weight="800" letter-spacing="-2" fill="#fff">GROSSE CODEBASEN</text>
    <text x="110" y="330" font-size="74" font-weight="800" letter-spacing="-2" fill="#fff">FÜR KI-AGENTEN</text>
    <text x="110" y="415" font-size="74" font-weight="800" letter-spacing="-2" fill="#f3b51b">ERSCHLIESSEN</text>
    <text x="115" y="475" font-size="28" font-weight="500" fill="#c9d6dc">Begrenzter Überblick. Gezielte Code-Details.</text>

    <g transform="translate(940 120)" filter="url(#shadow)">
      <rect width="510" height="470" rx="28" fill="#0d1c27" stroke="#fff" stroke-opacity=".14" stroke-width="2"/>
      <text x="42" y="60" font-size="18" font-weight="700" letter-spacing="2" fill="#8fa8b5">KONTEXT-PIPELINE</text>

      <g transform="translate(42 100)">
        <rect width="426" height="78" rx="16" fill="#1d3544" stroke="#6c8c9d" stroke-opacity=".6"/>
        <circle cx="42" cy="39" r="18" fill="#f3b51b"/>
        <path d="M34 39h16M42 31v16" stroke="#152330" stroke-width="4" stroke-linecap="round"/>
        <text x="76" y="34" font-size="24" font-weight="750" fill="#fff">Repo Map</text>
        <text x="76" y="58" font-size="17" fill="#aebfc8">globaler, begrenzter Überblick</text>
      </g>

      <path d="M255 190v38" stroke="#f3b51b" stroke-width="4" stroke-linecap="round"/>
      <path d="M245 219l10 12 10-12" fill="none" stroke="#f3b51b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

      <g transform="translate(42 240)">
        <rect width="426" height="78" rx="16" fill="#1d3544" stroke="#6c8c9d" stroke-opacity=".6"/>
        <circle cx="42" cy="39" r="18" fill="#65bdd5"/>
        <path d="M34 39h16M42 31v16" stroke="#152330" stroke-width="4" stroke-linecap="round"/>
        <text x="76" y="34" font-size="24" font-weight="750" fill="#fff">Serena + LSP</text>
        <text x="76" y="58" font-size="17" fill="#aebfc8">gezielte semantische Navigation</text>
      </g>

      <path d="M255 330v38" stroke="#65bdd5" stroke-width="4" stroke-linecap="round"/>
      <path d="M245 359l10 12 10-12" fill="none" stroke="#65bdd5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

      <g transform="translate(42 380)">
        <rect width="426" height="58" rx="16" fill="#f4f7f8"/>
        <text x="213" y="37" text-anchor="middle" font-size="21" font-weight="750" fill="#152330">präziser Kontext für den Agenten</text>
      </g>
    </g>

    <g transform="rotate(-8 800 680)" filter="url(#shadow)">
      <rect x="-110" y="605" width="1820" height="150" fill="url(#gold)"/>
      <path d="M-110 620H1710M-110 740H1710" stroke="#152330" stroke-opacity=".28" stroke-width="4"/>
      <text x="800" y="708" text-anchor="middle" font-size="93" font-weight="900" letter-spacing="17" fill="#152330">COMING SOON</text>
    </g>

    <text x="110" y="842" font-size="23" font-weight="650" letter-spacing="1.4" fill="#dfe8ec">TEAMFLOWENCER.DE · RALF KLEMMER</text>
  </g>
</svg>
